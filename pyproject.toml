[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notification-agent-mcp-server"
version = "0.1.6"
description = "Cloud-Dog notification backend with REST, MCP, A2A, and web admin interfaces"
readme = "README.md"
# W28R-3017: project-local Python 3.13 runtime contract (NF-005). The remediated
# runtime is Python 3.13 (3.12->3.13 clears the fixable CPython High/Critical CVEs);
# 3.10/3.11/3.12 are no longer permitted as the normal runtime.
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
  { name = "Cloud-Dog, Viewdeck Engineering Limited" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.31.1",
  "python-multipart>=0.0.30",
  "websockets==12.0",
  "jinja2==3.1.2",
  "itsdangerous==2.1.2",
  "starlette==1.3.1",
  "sqlalchemy==2.0.51",
  "aiosqlite==0.19.0",
  "pymysql==1.1.2",
  "psycopg==3.3.2",
  "httpx==0.28.1",
  "requests==2.34.2",
  "aiosmtplib==3.0.1",
  "email-validator==2.2.0",
  "pyyaml==6.0.3",
  "python-dotenv==1.0.0",
  "pydantic>=2.7.4",
  "pydantic-settings>=2.1.0",
  "cloud_dog_config==0.3.6",
  "cloud_dog_logging==0.4.1",
  "cloud_dog_api_kit==0.14.1",
  "cloud_dog_idam==0.5.4",
  "cloud_dog_jobs==0.4.4",
  "cloud_dog_llm==0.4.4",
  "cloud_dog_cache==0.2.3",
  "cloud_dog_storage==0.1.8",
  "cloud_dog_db==0.3.3",
  "hvac>=2.4.0",
  "passlib[bcrypt]==1.7.4",
  "python-jose[cryptography]==3.5.0",
  "bcrypt==4.1.1",
  "mcp>=1.24.0",
  "python-dateutil==2.8.2",
  "pytz==2023.3",
  "reportlab==4.0.7",
  "weasyprint==69.0",
  "pydyf==0.11.0",
  "pypdf==6.6.2",
  "pdfplumber==0.11.9",
  "cffi>=1.0.0",
  "markdown==3.5.1",
  "mutagen==1.47.0",
  "boto3>=1.40.61",
  "aioboto3>=15.5.0",
  "aioftp==0.22.3",
  "langdetect==1.0.9",
  # W28R-3017: reconcile pyproject with requirements.txt runtime deps so the
  # regenerated lock is complete (both were requirements.txt-only; psutil is a
  # hard runtime requirement for resource metrics — src/servers/api/api_server.py).
  "structlog>=21.0.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# W28R-3017: lint/tool target aligned to the project-local Python 3.13 runtime
# contract (NF-005). Do not lower below py313 without an operator/coordinator NO.
[tool.ruff]
target-version = "py313"
line-length = 120

[tool.pytest.ini_options]
markers = [
    "llm: requires live LLM endpoint (Ollama/OpenRouter)",
    "vdb: requires vector database (Chroma/Qdrant/OpenSearch)",
    "db: requires relational database (MySQL/PostgreSQL)",
    "smtp: requires SMTP/IMAP service",
    "mcp: requires external MCP server(s)",
    "docker: requires Docker build/run",
    "pure: no external dependencies",
    "fast: completes in <10 seconds",
    "slow: takes 10-120 seconds",
    "heavy: takes >120 seconds",
    "quality: QT tier",
    "unit: UT tier",
    "system: ST tier",
    "integration: IT tier",
    "application: AT tier",
]

[project.urls]
"Source" = "https://github.com/cloud-dog-ai/notification-agent-mcp-server"
